name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # پذیرش خودکار تمام لایسنس‌های اندروید
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # حذف چک‌سام گریدل جهت جلوگیری از خطای دانلود
      - name: Fix Gradle Wrapper Checksum
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i '/distributionSha256Sum/d' gradle/wrapper/gradle-wrapper.properties
          fi

      # ساخت خودکار فایل google-services.json با نام پکیج com.whitedra.vpn
      - name: Auto-generate google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "whitedra-vpn",
              "storage_bucket": "whitedra-vpn.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": {
                    "package_name": "com.whitedra.vpn"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly"}],
                "services": {"analytics_service": {"status": 1}}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhiteVPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
