name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0'

      - name: Accept SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean Gradle Checksum
        run: |
          find . -name "gradle-wrapper.properties" -exec sed -i '/distributionSha256Sum/d' {} +

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      # استخراج خودکار نام پکیج واقعی پروژه و تزریق فایل google-services
      - name: Inject Dynamic google-services.json
        run: |
          PKG=$(grep -oP '(namespace|applicationId)\s*=\s*"\K[^"]+' app/build.gradle.kts 2>/dev/null | head -n 1)
          if [ -z "$PKG" ]; then
            PKG="com.whitedra.vpn"
          fi
          echo "Detected Package Name: $PKG"

          mkdir -p app app/src/debug app/src/main
          cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "whitedra-vpn",
              "storage_bucket": "whitedra-vpn.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": { "package_name": "$PKG" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKey" }],
                "services": { "analytics_service": { "status": 1 } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:6543210987654321",
                  "android_client_info": { "package_name": "${PKG}.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKey" }],
                "services": { "analytics_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/google-services.json
          cp app/google-services.json app/src/main/google-services.json

      - name: Grant Exec Permissions
        run: chmod +x gradlew || true

      # ساخت کامل بدون غیرفعال کردن processDebugGoogleServices
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            -x test -x lint -Pandroid.lint.abortOnError=false --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiteVPN-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
