name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK & local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix gradlew Line Endings & Exec Permissions
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Inject Dummy google-services.json
        run: |
          mkdir -p app/src/debug app/src/main app
          JSON_CONTENT='{
            "project_info": {"project_number": "123456789012", "project_id": "whitedra-vpn", "storage_bucket": "whitedra-vpn.appspot.com"},
            "client": [
              {
                "client_info": {"mobilesdk_app_id": "1:123456789012:android:1234567890123456", "android_client_info": {"package_name": "com.whitedra.vpn"}},
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly"}],
                "services": {"analytics_service": {"status": 1}}
              }
            ],
            "configuration_version": "1"
          }'
          echo "$JSON_CONTENT" > google-services.json
          echo "$JSON_CONTENT" > app/google-services.json
          echo "$JSON_CONTENT" > app/src/debug/google-services.json
          echo "$JSON_CONTENT" > app/src/main/google-services.json

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test -x lint -Pandroid.lint.abortOnError=false --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhiteVPN-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
