name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Remove Gradle Checksum Validation
        run: |
          find . -name "gradle-wrapper.properties" -exec sed -i '/distributionSha256Sum/d' {} +

      # ساخت کی‌استور دیباگ و کپی در مسیرهای احتمالی پروژه
      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp ~/.android/debug.keystore ./debug.keystore || true
          cp ~/.android/debug.keystore app/debug.keystore || true

      - name: Inject Dummy google-services.json
        run: |
          mkdir -p app/src/debug app/src/main
          JSON_CONTENT='{
            "project_info": {"project_number": "123456789012", "project_id": "whitedra-vpn", "storage_bucket": "whitedra-vpn.appspot.com"},
            "client": [
              {
                "client_info": {"mobilesdk_app_id": "1:123456789012:android:1234567890123456", "android_client_info": {"package_name": "com.whitedra.vpn"}},
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly"}],
                "services": {"analytics_service": {"status": 1}}
              }
            ],
            "configuration_version": "1"
          }'
          echo "$JSON_CONTENT" > app/google-services.json
          echo "$JSON_CONTENT" > app/src/debug/google-services.json

      - name: Grant Exec Permissions
        run: chmod +x gradlew || true

      # ساخت APK با رد کردن تست‌ها، لینت و تایید امضای دیباگ
      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test -x lint -x validateSigningDebug -Pandroid.lint.abortOnError=false --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiteVPN-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
